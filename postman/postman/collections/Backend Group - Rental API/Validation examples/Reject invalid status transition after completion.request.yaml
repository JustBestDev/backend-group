$kind: http-request
url: "{{baseUrl}}/api/rentals/{{rentalId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "ACTIVE"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 2000
