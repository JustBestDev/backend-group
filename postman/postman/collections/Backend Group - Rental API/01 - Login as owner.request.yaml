$kind: http-request
description: Logs in as the property owner and saves the JWT as ownerToken.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{ownerEmail}}",
      "password": "{{ownerPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Response contains token and OWNER role', () => {
        pm.expect(json.token).to.be.a('string').and.not.empty;
        pm.expect(json.user.role).to.eql('OWNER');
      });
      if (json.token) pm.collectionVariables.set('ownerToken', json.token);
    language: text/javascript
order: 2000
