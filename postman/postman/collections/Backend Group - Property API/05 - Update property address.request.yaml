$kind: http-request
url: "{{baseUrl}}/api/properties/{{propertyId}}/address"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "road": "Updated Rama I Road",
      "building": "Updated Postman Building"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Address is updated', () => pm.expect(pm.response.json().data.building).to.eql('Updated Postman Building'));
    language: text/javascript
order: 6000
