$kind: http-request
url: "{{baseUrl}}/api/properties/{{propertyId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "description": "Updated by Postman automated test",
      "monthlyRent": 16000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Fields are updated and review returns to PENDING', () => { pm.expect(Number(json.data.monthlyRent)).to.eql(16000); pm.expect(json.data.publishStatus).to.eql('PENDING'); });
    language: text/javascript
order: 5000
