$kind: http-request
url: "{{baseUrl}}/api/properties/{{propertyId}}/address"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "province": "{{province}}",
      "district": "Pathum Wan",
      "subDistrict": "Lumphini",
      "postcode": "10330",
      "road": "Rama I Road",
      "building": "Postman Building",
      "latitude": 13.7466,
      "longitude": 100.5393
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('Address belongs to created property', () => { pm.expect(json.data.propertyId).to.eql(Number(pm.collectionVariables.get('propertyId'))); pm.expect(json.data.province).to.eql(pm.collectionVariables.get('province')); });
    language: text/javascript
order: 4000
