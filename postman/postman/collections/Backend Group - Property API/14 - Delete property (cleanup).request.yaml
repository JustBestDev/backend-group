$kind: http-request
description: Soft-deletes the property created by this collection and changes its propertyStatus to CLOSED.
url: "{{baseUrl}}/api/properties/{{propertyId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Deleted ID matches test property', () => pm.expect(pm.response.json().data.id).to.eql(Number(pm.collectionVariables.get('propertyId'))));
    language: text/javascript
order: 15000
