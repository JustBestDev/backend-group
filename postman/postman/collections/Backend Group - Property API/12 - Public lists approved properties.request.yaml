$kind: http-request
url: "{{baseUrl}}/api/properties?q=Postman&province={{province}}&propertyType=CONDO&rentType=WHOLE_UNIT&propertyStatus=AVAILABLE&minRent=10000&maxRent=20000&page=1&limit=10"
method: GET
queryParams:
  q: Postman
  province: "{{province}}"
  propertyType: CONDO
  rentType: WHOLE_UNIT
  propertyStatus: AVAILABLE
  minRent: "10000"
  maxRent: "20000"
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Pagination and filters return approved property', () => { pm.expect(json.pagination.page).to.eql(1); const found = json.data.find(item => item.id === Number(pm.collectionVariables.get('propertyId'))); pm.expect(found).to.exist; pm.expect(found.publishStatus).to.eql('APPROVED'); });
    language: text/javascript
order: 13000
