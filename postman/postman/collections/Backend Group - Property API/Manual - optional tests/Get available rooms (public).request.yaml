$kind: http-request
description: Property must be APPROVED.
url: "{{baseUrl}}/api/properties/{{propertyId}}/rooms"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Response contains rooms array', () => pm.expect(pm.response.json().data.rooms).to.be.an('array'));
    language: text/javascript
order: 4000
