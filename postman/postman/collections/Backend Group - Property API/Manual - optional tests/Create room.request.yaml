$kind: http-request
description: Use with an INDIVIDUAL_ROOM property before cleanup.
url: "{{baseUrl}}/api/properties/{{propertyId}}/rooms"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "roomName": "Room A",
      "description": "Postman test room",
      "monthlyRent": 8000,
      "status": "AVAILABLE",
      "capacity": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Room is created', () => pm.expect(json.data.id).to.be.a('number'));
      if (json.data?.id) pm.collectionVariables.set('roomId', json.data.id);
    language: text/javascript
order: 3000
