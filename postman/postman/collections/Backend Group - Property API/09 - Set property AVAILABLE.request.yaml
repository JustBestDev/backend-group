$kind: http-request
url: "{{baseUrl}}/api/properties/{{propertyId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "propertyStatus": "AVAILABLE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Property becomes AVAILABLE', () => pm.expect(pm.response.json().data.propertyStatus).to.eql('AVAILABLE'));
    language: text/javascript
order: 10000
