$kind: http-request
url: "{{baseUrl}}/api/properties/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('Created property is present', () => { const found = json.data.find(item => item.id === Number(pm.collectionVariables.get('propertyId'))); pm.expect(found).to.exist; pm.expect(found.address).to.exist; });
    language: text/javascript
order: 7000
