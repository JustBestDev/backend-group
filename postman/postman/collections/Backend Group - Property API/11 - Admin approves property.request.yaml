$kind: http-request
url: "{{baseUrl}}/api/admin/properties/{{propertyId}}/publish-status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "publishStatus": "APPROVED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Property becomes APPROVED', () => pm.expect(pm.response.json().data.publishStatus).to.eql('APPROVED'));
    language: text/javascript
order: 12000
